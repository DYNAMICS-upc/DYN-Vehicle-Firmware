[env]
build_flags =
    -Wall
    -Iinclude
lib_ldf_mode = deep+

[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -Werror
build_unflags = -fuse-cxa-atexit

[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
