; Configuracion final para Steering (Arduino Mega)
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    coryjfowler/mcp_can@^1.5.1
    feilipu/FreeRTOS@^11.1.0-3
monitor_speed = 115200
build_flags =
    -Wall
    -Werror

[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<main.cpp>
